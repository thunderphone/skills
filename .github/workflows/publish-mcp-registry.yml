# Runs in the public mirror repo (thunderphone/skills), not in the monorepo: the
# mirror workflow pushes the agent-skills/ subtree, so this file lands at
# .github/workflows/ there. Republishes server.json to the official MCP Registry
# under io.github.thunderphone/* using GitHub OIDC (no secret). The OIDC credential can
# publish or overwrite any io.github.thunderphone/* entry, so the boundary is whoever can
# make this job run: keep write access to the mirror repo limited to org owners and the
# mirror deploy token. If main is ever protected, the ruleset must still allow the mirror
# identity to force-push (the monorepo mirror workflow pushes with --force).
name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths: ["server.json"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate
        run: ./mcp-publisher validate
      - name: Authenticate
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
